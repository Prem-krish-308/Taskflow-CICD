apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-qa-task
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Prem-krish-308/Taskflow-CICD.git
    targetRevision: release/1.1.0
    path: helm/charts/task-service
    helm:
      releaseName: task-service
      valueFiles:
        - ../../environments/qa/task-service-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow-qa

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
