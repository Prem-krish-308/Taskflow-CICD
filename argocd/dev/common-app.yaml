apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-dev-common
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Prem-krish-308/Taskflow-CICD.git
    targetRevision: develop
    path: helm/environments/dev/common

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true