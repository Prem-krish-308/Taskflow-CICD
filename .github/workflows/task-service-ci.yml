name: task-service-ci

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/task-service/**'
      - '.github/workflows/task-service-ci.yml'

  push:
    branches:
      - develop
    paths:
      - 'src/task-service/**'
      - '.github/workflows/task-service-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            src/task-service/requirements.txt
            src/task-service/requirements-test.txt

      - name: Install dependencies
        working-directory: src/task-service
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        working-directory: src/task-service
        run: |
          python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./src/task-service
          file: ./src/task-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskflow-task:${{ github.sha }}

  
  updatek8s:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    concurrency:
      group: gitops-frontend-dev
      cancel-in-progress: false

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Prem-krish-308/Taskflow-GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update Frontend image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|" \
            helm/environments/dev/task-service-values.yaml

          git diff

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/environments/dev/task-service-values.yaml

          if git diff --cached --quiet; then
            echo "Image tag already updated"
            exit 0
          fi

          git commit -m "[CI] Update Dev task-service image tag"

          for attempt in {1..5}; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          exit 1
