name: task-service-ci

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/task-service/**'
      - '.github/workflows/task-service-ci.yml'

  push:
    branches:
      - develop
    paths:
      - 'src/task-service/**'
      - '.github/workflows/task-service-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            src/task-service/requirements.txt
            src/task-service/requirements-test.txt

      - name: Install dependencies
        working-directory: src/task-service
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        working-directory: src/task-service
        run: |
          python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./src/task-service
          file: ./src/task-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskflow-task:${{ github.sha }}

  updatek8s:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Task Service image tag
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|" helm/environments/dev/task-service-values.yaml

      - name: Commit and push changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add kubernetes/task-service/deploy.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "[CI]: Update task-service image tag"
          git pull --rebase origin develop
          git push origin HEAD:develop

