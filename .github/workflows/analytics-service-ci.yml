
name: analytics-service-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/analytics-service/**'
      - '.github/workflows/analytics-service-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'src/analytics-service/**'
      - '.github/workflows/analytics-service-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            src/analytics-service/requirements.txt
            src/analytics-service/requirements-test.txt

      - name: Install dependencies
        working-directory: src/analytics-service
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        working-directory: src/analytics-service
        run: |
          python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./src/analytics-service
          file: ./src/analytics-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskflow-analytics:${{ github.sha }}
