
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 1.1.0"
        required: true
        type: string

      target_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - qa
          - preprod
          - prod

permissions:
  contents: read

concurrency:
  group: taskflow-release-management
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    environment: ${{ inputs.target_environment }}

    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version"
            exit 1
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Prem-krish-308/Taskflow-GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: pip install ruamel.yaml==0.18.10

      - name: Promote release images
        env:
          VERSION: ${{ inputs.release_version }}
          TARGET_ENV: ${{ inputs.target_environment }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True

          version = os.environ["VERSION"]
          target = os.environ["TARGET_ENV"]

          release_file = Path(f"releases/{version}.yaml")

          if not release_file.exists():
              raise ValueError("Release snapshot does not exist")

          snapshot = yaml.load(release_file)

          if str(snapshot["release"]) != version:
              raise ValueError("Release version mismatch")

          services = [
              "frontend",
              "task-service",
              "analytics-service"
          ]

          base = Path("helm/environments")

          previous_environment = {
              "preprod": "qa",
              "prod": "preprod"
          }

          if target in previous_environment:
              previous = previous_environment[target]

              for service in services:
                  previous_file = (
                      base / previous /
                      f"{service}-values.yaml"
                  )

                  previous_values = yaml.load(previous_file)
                  expected = snapshot["images"][service]

                  for field in ["repository", "tag"]:
                      if previous_values["image"][field] != expected[field]:
                          raise ValueError(
                              f"Release {version} is not configured "
                              f"in {previous} for {service}"
                          )

          for service in services:
              target_file = (
                  base / target /
                  f"{service}-values.yaml"
              )

              values = yaml.load(target_file)
              expected = snapshot["images"][service]

              if values["image"]["repository"] != expected["repository"]:
                  raise ValueError(
                      f"Repository mismatch: {service}"
                  )

              old_tag = values["image"]["tag"]
              new_tag = expected["tag"]

              print(f"{service}: {old_tag} -> {new_tag}")

              if old_tag != new_tag:
                  values["image"]["tag"] = new_tag
                  yaml.dump(values, target_file)

          print(f"Release {version} promoted to {target}")
          PY

      - name: Review changes
        run: git diff

      - name: Commit and push promotion
        env:
          VERSION: ${{ inputs.release_version }}
          TARGET_ENV: ${{ inputs.target_environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "helm/environments/${TARGET_ENV}/"

          if git diff --cached --quiet; then
            echo "Release already configured in ${TARGET_ENV}"
            exit 0
          fi

          git commit -m "[Promotion] Release ${VERSION} to ${TARGET_ENV}"

          for attempt in {1..5}; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 5
          done

          exit 1
